<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Turbo Delivery Dash</title>
    <meta name="description" content="A high-octane delivery runner game. Start on a scooter and upgrade to a race car.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚚%3C/text%3E%3C/svg%3E">
    
    <script>
      // Shim process.env for browser compatibility to prevent ReferenceErrors
      window.process = window.process || { env: { API_KEY: '' } };

      // Tailwind Config must be defined before tailwind script loads or immediately handled
      window.tailwind = {
        config: {
          theme: {
            extend: {
              animation: {
                'road-scroll': 'road-scroll 0.5s linear infinite',
              },
              backgroundImage: {
                'dashed-line': "linear-gradient(to bottom, transparent 50%, rgba(255, 255, 255, 0.5) 50%)",
              },
              backgroundSize: {
                'dashed-line': '20px 80px'
              },
              keyframes: {
                'road-scroll': {
                  '0%': { backgroundPosition: '0 0' },
                  '100%': { backgroundPosition: '0 80px' },
                }
              }
            }
          }
        }
      };

      // Suppress specific warnings to keep console clean
      (function() {
        const originalWarn = console.warn;
        const originalLog = console.log;
        const originalError = console.error;
        
        const isIgnorableMessage = (args) => {
          try {
            const msg = args[0];
            if (typeof msg !== 'string') return false;
            return msg.includes('cdn.tailwindcss.com') || 
                   msg.includes('should not be used in production') ||
                   msg.includes('TagError'); 
          } catch (e) {
            return false;
          }
        };

        console.warn = function(...args) {
          if (isIgnorableMessage(args)) return;
          originalWarn.apply(console, args);
        };
        
        console.log = function(...args) {
          if (isIgnorableMessage(args)) return;
          originalLog.apply(console, args);
        };

        console.error = function(...args) {
           if (isIgnorableMessage(args)) return;
           originalError.apply(console, args);
        }
      })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      
      /* Disable touch gestures on mobile for better game control */
      body {
        overscroll-behavior: none;
        touch-action: none;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
      }
    }
    </script>
</head>
  <body class="bg-black text-white overflow-hidden">
    <div id="root"></div>
  </body>
</html>
